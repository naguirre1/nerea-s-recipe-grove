name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        
      - name: Checkout recipes repo
        uses: actions/checkout@v4
        with:
          repository: naguirre1/knowledge-garden-nerea
          path: ./recipes-external
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci

      - name: Convert Terms Format
        run: node convert-terms.js "./recipes-external/🌳 Forest/🕷️ Recipes"

      - name: Debug - List term JSON files
        run: ls -la "./recipes-external/🌳 Forest/🕷️ Recipes"/*.term.json || echo "No term JSON files found"

      - name: Merge Terms into glossary.ts
        run: node merge-glossary.js

      - name: Debug - Check glossary.ts after merge
        run: grep -c "id:" src/data/glossary.ts || echo "0"

      - name: Convert Recipe Format
        run: node convert-recipes.js "./recipes-external/🌳 Forest/🕷️ Recipes"

      - name: Debug - List JSON files
        run: ls -la "./recipes-external/🌳 Forest/🕷️ Recipes"/*.json || echo "No JSON files found"

      - name: Debug - Check recipes.ts before merge
        run: grep -c "  {" src/data/recipes.ts || echo "0"

      - name: Merge Recipes into recipes.ts
        env:
          NODE_ENV: production
        run: node merge-recipes.js

      - name: Debug - Check recipes.ts after merge
        run: grep -c "  {" src/data/recipes.ts || echo "0"
        
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
